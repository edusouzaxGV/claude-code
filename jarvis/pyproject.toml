[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zemark"
version = "0.1.0"
description = "ZEMARK — a genuinely good, free, self-hosted Jarvis (voice, memory, proactivity)."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
dependencies = [
    "claude-agent-sdk>=0.2,<0.3",
    "python-dotenv>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# The full desktop voice stack (Pipecat). Kept optional so the pure-Python
# core (config, memory, wake-phrase, persona, proactivity) installs and tests
# without the heavy audio deps.
voice = ["pipecat-ai[local,silero,whisper,kokoro,groq]==1.6.*"]
livekit = ["livekit-agents[silero,turn-detector,groq]~=1.6", "kokoro-onnx>=0.4"]
wake = ["openwakeword>=0.6", "pvporcupine>=3.0", "sounddevice>=0.4"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
zemark = "run:main"

[tool.setuptools]
py-modules = ["run"]

[tool.setuptools.packages.find]
include = ["zemark*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
