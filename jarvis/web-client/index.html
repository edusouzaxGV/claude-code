<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZEMARK — Voz</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        min-height: 100vh;
        margin: 0;
        align-items: center;
        justify-content: center;
        background: #0f1115;
        color: #e8e8ea;
      }
      main { text-align: center; max-width: 28rem; padding: 2rem; }
      h1 { font-weight: 600; letter-spacing: 0.02em; }
      button {
        font-size: 1.1rem;
        padding: 0.9rem 1.8rem;
        border-radius: 999px;
        border: none;
        background: #4f7cff;
        color: white;
        cursor: pointer;
        transition: background 0.15s, opacity 0.15s;
      }
      button:hover:not(:disabled) { background: #3d63d8; }
      button:disabled { opacity: 0.5; cursor: default; }
      #status {
        margin-top: 1.4rem;
        min-height: 1.4em;
        font-size: 0.95rem;
        opacity: 0.85;
      }
      #status.error { color: #ff6b6b; }
      #status.connected { color: #4ade80; }
    </style>
  </head>
  <body>
    <main>
      <h1>ZEMARK</h1>
      <button id="talk">Falar com ZEMARK</button>
      <p id="status">Pronto.</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
